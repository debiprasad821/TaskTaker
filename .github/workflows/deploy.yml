name: Generate APK and Upload to Drive

on:
  push:
    branches:
      - main  # This triggers the script every time you merge/push to main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from your repository onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup the Java environment needed to run Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Ensure the Gradle wrapper script is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Run the Gradle task to build a Debug APK
      # We use assembleDebug here because it doesn't require signing keys to work.
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 5. Upload the generated APK to your Google Drive
      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.MAIN_SERVICE_ACCOUNT_JSON }}
          filename: app/build/outputs/apk/debug/app-debug.apk
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          name: "TaskTaker-${{ github.run_number }}.apk"
          overwrite: false